[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-cap"
version = "0.1.0"
description = "A Python project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.6.4",
    "pandas>=2.3.3",
    "pytz>=2026.5",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
